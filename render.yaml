services:
  - type: web
    name: api-grama-webcam
    runtime: python
    # Oregon == AWS us-west-2. Crie o projeto Neon na MESMA região para as
    # queries não atravessarem o continente a cada request.
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Fixa a versão: o código usa sintaxe `X | None` que o Pydantic resolve
      # em runtime e exige 3.10+. Sem pinar, um default antigo quebra o boot.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # sync: false faz o Render pedir o valor no dashboard, em vez de
      # versionar segredo no Git.
      - key: DATABASE_URL
        sync: false
      - key: API_KEY_WRITE
        sync: false
      - key: API_KEY_READ
        sync: false

  # Jogo da feira de ciências. Serviço separado de propósito: o jogo importa
  # código que a API não tem, e um deploy dele não pode derrubar a produção.
  # NÃO instala requirements-station.txt: quem fala com a câmera é a ponte, que
  # roda no notebook da feira.
  - type: web
    name: jogo-grama-webcam
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-jogo.txt
    startCommand: uvicorn jogo.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HOST_TOKEN
        sync: false
      - key: PONTE_TOKEN
        sync: false
      # URL pública do próprio serviço, usada no QR code.
      - key: JOGO_URL_PUBLICA
        sync: false
      # A medição da feira é postada na API de produção como
      # regiao="Feira de Ciências".
      - key: API_URL
        sync: false
      - key: API_KEY_WRITE
        sync: false
